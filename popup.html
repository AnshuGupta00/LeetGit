<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 300px; padding: 12px; font-family: sans-serif; }
    input, button, select, textarea { width: 100%; margin: 4px 0; padding: 6px; box-sizing: border-box; font-family: inherit; }
    #settingsLink { display: block; text-align: center; margin-bottom: 10px; }
    #settingsLink a { background: #0a66c2; color: white; padding: 8px 12px; text-decoration: none; border-radius: 5px; font-size: 14px; cursor: pointer; }
    #settingsLink a:hover { background: #054399; }
  </style>
</head>
<body>
  <!-- Settings Link -->
  <div id="settingsLink">
    <a href="settings.html" target="_blank">⚙️ Settings</a>
  </div>

  <div id="setup">
    <input id="token" placeholder="GitHub Personal Access Token" type="password">
    <input id="repo" placeholder="username/repo-name">
    <button id="saveSettings">Save Settings</button>
  </div>
  <hr>
  <button id="push">Push Current Solution</button>
  <p id="problemInfo"></p>
  <p id="status"></p>
  <hr>  
  <button id="shareLinkedin">Generate LinkedIn Post</button>
  <textarea id="linkedinText" rows="9" style="display:none;"></textarea>
  <canvas id="cardCanvas" width="1200" height="675" style="display:none;"></canvas>
  <img id="cardPreview" style="width:100%; border-radius:6px; margin:6px 0; display:none;">
  <a id="downloadImage" style="display:none; text-align:center;" download="leetcode-card.png">Download Image</a>
  <button id="postButton" style="display: none; background: #27ae60; padding: 10px 20px; cursor: pointer;">
    📤 Post to LinkedIn Now
  </button>
  <p id="linkedinStatus"></p>
  <script src="popup.js"></script>
</body>
</html>
